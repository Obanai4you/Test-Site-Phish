```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Security Awareness Training</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #fff;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border: 1px solid #ddd;
            border-radius: 12px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #111;
            outline-offset: 1px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #111;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        button:disabled {
            background: #777;
            cursor: wait;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            color: #777;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Security Awareness</h1>

        <p class="description">
            This demonstration is part of an authorized security
            awareness exercise. Do not enter real passwords.
        </p>

        <form id="trainingForm">
            <label for="username">Test username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter a dummy username"
                autocomplete="off"
                required
            >

            <label for="password">Test password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter a dummy password"
                autocomplete="off"
                required
            >

            <button type="submit" id="submitButton">
                Submit Test
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <p class="footer">
            Security Awareness Training
        </p>
    </main>

    <script>
        const form = document.getElementById("trainingForm");
        const button = document.getElementById("submitButton");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            // Send only the event name, never the field values.
            button.disabled = true;
            message.textContent = "Recording training event...";

            try {
                const response = await fetch(
                    "http://127.0.0.1:8000/api/training-event",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            event: "training_form_submitted"
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error("The API returned an error.");
                }

                message.textContent =
                    "Training event recorded successfully.";

                // Clear the test fields after submission.
                form.reset();

            } catch (error) {
                message.textContent =
                    "Could not contact the training API. " +
                    "Check that the backend is running.";

                console.error(error);

            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
